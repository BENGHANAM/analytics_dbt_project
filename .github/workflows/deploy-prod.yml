name: Deploy to PROD

on:
  push:
    branches:
      - main

jobs:
  deploy-prod:
    name: Run dbt PROD pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-core dbt-bigquery

      - name: Create profiles.yml
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          mkdir -p ~/.dbt
          echo "${GCP_SA_KEY}" > /tmp/gcp-key.json
          cat > ~/.dbt/profiles.yml << 'EOF'
          online_retail:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: service-account
                project: sales-dbt-project
                dataset: dbt_prod
                location: EU
                keyfile: /tmp/gcp-key.json
                threads: 4
                timeout_seconds: 300
          EOF

      - name: Run dbt PROD
        run: dbt run --target prod

      - name: Test dbt PROD
        run: dbt test --target prod
      
      - name :  Deploy DAG to Composer
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |  
          echo "${GCP_SA_KEY}" > /tmp/gcp-key.json
          gcloud auth activate-service-account \
          --key-file=/tmp/gcp-key.json
          gcloud config set project sales-dbt-project
          gsutil cp dags/dbt_online_retail_pipeline.py \
            gs://${{ secrets.DBT_COMPOSER_BUCKET }}/dags/
          gsutil -m cp -r dags/dbt \
            gs://${{ secrets.DBT_COMPOSER_BUCKET }}/dags/
    
      - name: Deploy SA key to Composer GCS
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "${GCP_SA_KEY}" > /tmp/dbt-runner-key.json
          gcloud auth activate-service-account \
            --key-file=/tmp/dbt-runner-key.json
          gcloud config set project sales-dbt-project
          gsutil cp /tmp/dbt-runner-key.json \
            gs://${{ secrets.DBT_COMPOSER_BUCKET }}/dags/dbt/dbt-runner-key.json

